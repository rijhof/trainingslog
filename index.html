<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingslog Oberkörper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #f4f6f5;
    --surface: #ffffff;
    --ink: #1b2422;
    --muted: #66726e;
    --line: #dde3e0;
    --field: #f7f9f8;
    --accent: #2c5e86;
    --accent-ink: #ffffff;
    --accent-soft: #e6eef5;
    --danger: #a93d2c;
    --done: #2f7a55;
    --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141918; --surface: #1c2322; --ink: #e8eeec; --muted: #93a09b;
      --line: #2e3836; --field: #232b2a; --accent: #7fb0d8; --accent-ink: #0f1a24;
      --accent-soft: #22303b; --danger: #e0806f; --done: #7cc59f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141918; --surface: #1c2322; --ink: #e8eeec; --muted: #93a09b;
    --line: #2e3836; --field: #232b2a; --accent: #7fb0d8; --accent-ink: #0f1a24;
    --accent-soft: #22303b; --danger: #e0806f; --done: #7cc59f;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 var(--body);
    padding: 0 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 20px; }

  header { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font: 700 2rem/1 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: .9rem; margin: 6px 0 0; }

  button { font: inherit; cursor: pointer; border-radius: 8px; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: 0;
    font: 600 1rem var(--display); letter-spacing: .02em; padding: 11px 18px;
  }
  .btn-ghost { background: none; border: 1px dashed var(--line); color: var(--accent); font-weight: 600; font-size: .9rem; padding: 6px 12px; }
  .btn-ghost:hover { border-color: var(--accent); }
  .btn-x { background: none; border: 0; color: var(--muted); width: 36px; height: 36px; font-size: 1rem; }
  .btn-x:hover { color: var(--danger); }
  .btn-danger { background: var(--danger); color: var(--surface); border: 0; padding: 7px 12px; font-weight: 600; font-size: .9rem; }
  .btn-plain { background: none; border: 1px solid var(--line); color: var(--ink); padding: 7px 12px; font-size: .9rem; }
  .btn-delete { background: none; border: 0; color: var(--muted); font-size: .9rem; padding: 7px 0; text-decoration: underline; text-underline-offset: 3px; }
  .btn-delete:hover { color: var(--danger); }

  details.session { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  summary {
    list-style: none; cursor: pointer; padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▾"; color: var(--muted); transition: transform .15s; }
  details:not([open]) summary::after { transform: rotate(-90deg); }
  .s-date { font: 700 1.25rem/1.1 var(--display); }
  .s-date small { display: block; font: 500 .8rem var(--body); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }
  .s-count { margin-left: auto; font: 500 .8rem var(--mono); color: var(--muted); background: var(--field); padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  .s-count.full { color: var(--done); }

  .exercises { list-style: none; margin: 0; padding: 0 18px; counter-reset: ex; }
  .ex { border-top: 1px solid var(--line); padding-block: 16px; display: grid; gap: 10px; counter-increment: ex; }
  .ex-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .ex-name { font: 600 1.1rem/1.2 var(--display); margin: 0; }
  .ex-name::before { content: counter(ex) "  "; color: var(--muted); font: 500 .85rem var(--mono); }
  .ex-en { display: block; font: 400 .8rem var(--body); color: var(--muted); margin-top: 2px; }
  .ex-target { font: 500 .78rem var(--mono); color: var(--accent); background: var(--accent-soft); padding: 3px 7px; border-radius: 5px; white-space: nowrap; }

  .sets { display: grid; gap: 6px; }
  .set { display: grid; grid-template-columns: 26px 1fr 1fr 36px; gap: 8px; align-items: center; }
  .set-n { font: 500 .8rem var(--mono); color: var(--muted); text-align: center; }
  .field { position: relative; }
  .field input {
    width: 100%; min-width: 0; padding: 9px 38px 9px 10px;
    background: var(--field); border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
    font: 500 1rem var(--mono); font-variant-numeric: tabular-nums;
  }
  .field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: .75rem; color: var(--muted); pointer-events: none; }
  .ex-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .s-foot { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .s-foot .q { color: var(--danger); font-weight: 600; font-size: .9rem; margin-right: auto; }

  main { display: grid; gap: 16px; }
  .adds { display: flex; gap: 8px; flex-wrap: wrap; }
  .plans { display: grid; gap: 8px; }
  .plan summary { font: 600 1rem var(--display); color: var(--accent); }
  .plan-body { padding: 0 18px 16px; display: grid; gap: 12px; }
  .plan-hint { color: var(--muted); font-size: .85rem; margin: 0; }
  .p-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .p-row input { width: 100%; min-width: 0; padding: 8px 10px; background: var(--field); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: 400 .95rem var(--body); }
  .p-row .p-name { grid-column: 1 / -1; font-weight: 600; }
  .p-tools { grid-column: 1 / -1; display: flex; gap: 4px; align-items: center; }
  .p-tools label { font-size: .8rem; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-right: auto; }
  .p-tools input { width: 64px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { summary::after { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Trainingslog</h1>
      <p class="sub">Oberkörper & Unterkörper · wird automatisch in diesem Browser gespeichert</p>
    </div>
    <div class="adds">
      <button class="btn-primary" data-add="upper">+ Oberkörper</button>
      <button class="btn-primary" data-add="lower">+ Unterkörper</button>
    </div>
  </header>
  <div class="plans" id="plans"></div>
  <main id="list"></main>
</div>

<script>
const KEY = "trainingslog";
const EX = [
  ["Schrägbank Langhantel", "Incline Barbell Bench Press", "3–4 × 6–10", 4],
  ["Kabelzug Flys", "Seated Cable Fly", "3 × 10–12", 3],
  ["Lattziehen", "Lat Pulldown", "3 × 6–8", 3],
  ["Seitliches Schulterheben am Kabel", "High Cable Lateral Raise", "2–3 × 8–10", 3],
  ["Meadows Row", "Meadows Row", "3 × 8–10", 3],
  ["Trizeps-Pulldown", "Triceps Pushdown", "3 × 10–12", 3],
  ["Bayesian Cable Curl", "Bayesian Cable Curl", "3 × 10–12", 3],
  ["Scott-Curls", "Preacher Curl", "3 × 10–12", 3],
];
const SEED = [
  [[17.5,10],[22.5,6],[25,6],[25,6]],
  [[19,10],[33,10],[47,10]],
  [[40,8],[57,8],[77,4]],
  [[7.5,7],[5,8],[5,8]],
  [[30,8],[40,8],[40,8]],
  [[20,10],[25,8],[25,8]],
  [[15,6],[10,10],[10,12]],
  [[8,5],[10,10],[10,4]],
];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toLocaleDateString("sv"); // YYYY-MM-DD in local time

const PLAN_KEY = "trainingsplan";
const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const PLAN_NAMES = { upper: "Oberkörper", lower: "Unterkörper" };
const LOWER = [
  ["Liegender Beinbeuger", "Lying Leg Curl", "2 × 6–8", 2],
  ["Pendulum Squat", "Pendulum Squat", "3 × 6–8", 3],
  ["Rumänisches Kreuzheben", "Romanian Deadlift", "3 × 6–8", 3],
  ["Beinstrecker", "Leg Extension", "2 × 8–10", 2],
  ["Adduktoren-/Hüftmaschine", "Hip Adductor Machine", "2 × 8–10", 2],
  ["Wadenheben stehend", "Standing Calf Raise", "2 × 8–10", 2],
];
const toPlan = list => list.map(([n, en, t, c]) => ({ n, en, t, c }));
// v2 stored a single upper-body plan array under PLAN_KEY.
const stored = get(PLAN_KEY);
let plans = Array.isArray(stored) ? { upper: stored } : stored || {};
plans = { upper: plans.upper || toPlan(EX), lower: plans.lower || toPlan(LOWER) };
// Sessions from v1 stored bare set arrays indexed into EX.
let sessions = (get(KEY) || [{ id: uid(), date: "2026-09-22",
  exercises: SEED.map(sets => sets.map(([w, r]) => ({ w: String(w), r: String(r) }))) }])
  .map(s => ({ ...s, exercises: s.exercises.map((x, i) => Array.isArray(x) ? { n: EX[i][0], en: EX[i][1], t: EX[i][2], sets: x } : x) }));
let confirming = null;
const save = () => set(KEY, sessions);
const savePlan = () => set(PLAN_KEY, plans);
save();

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const counts = s => {
  const all = s.exercises.flatMap(x => x.sets);
  return [all.filter(x => x.w !== "" && x.r !== "").length, all.length];
};

const list = document.getElementById("list");
const openState = {};

function render() {
  const sorted = [...sessions].sort((a, b) => b.date.localeCompare(a.date));
  if (!sorted.length) { list.innerHTML = `<p class="empty">Noch keine Einheit. Leg mit „+ Neue Einheit“ los.</p>`; return; }
  list.innerHTML = sorted.map(s => {
    const [a, b] = counts(s);
    return `
    <details class="session" data-s="${s.id}" ${openState[s.id] !== false ? "open" : ""}>
      <summary>
        <span class="s-date">${new Date(s.date + "T12:00").toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" })}<small>${new Date(s.date + "T12:00").toLocaleDateString("de-DE", { weekday: "long" })} · ${PLAN_NAMES[s.plan || "upper"]}</small></span>
        <span class="s-count ${a === b && b ? "full" : ""}">${a} / ${b} Sätze ausgefüllt</span>
      </summary>
      <ol class="exercises">
        ${s.exercises.map(({ n, en, t, sets }, i) => `
        <li class="ex">
          <div class="ex-head">
            <h2 class="ex-name">${esc(n)}${en && en !== n ? `<span class="ex-en">${esc(en)}</span>` : ""}</h2>
            <span class="ex-target" title="Ziel: Sätze × Wiederholungen">${esc(t)}</span>
          </div>
          <div class="sets">
            ${sets.map((st, j) => `
            <div class="set">
              <span class="set-n">${j + 1}</span>
              <label class="field"><span class="sr">Satz ${j + 1} Gewicht</span>
                <input id="w-${s.id}-${i}-${j}" inputmode="decimal" data-e="${i}" data-j="${j}" data-k="w" value="${esc(st.w)}" placeholder="–"><span aria-hidden="true">kg</span></label>
              <label class="field"><span class="sr">Satz ${j + 1} Wiederholungen</span>
                <input id="r-${s.id}-${i}-${j}" inputmode="numeric" data-e="${i}" data-j="${j}" data-k="r" value="${esc(st.r)}" placeholder="–"><span aria-hidden="true">Wdh</span></label>
              <button class="btn-x" data-act="del-set" data-e="${i}" data-j="${j}" aria-label="Satz ${j + 1} entfernen">✕</button>
            </div>`).join("")}
          </div>
          <div class="ex-foot"><button class="btn-ghost" data-act="add-set" data-e="${i}">+ Satz</button><button class="btn-delete" data-act="del-ex" data-e="${i}">Übung entfernen</button></div>
        </li>`).join("")}
      </ol>
      <div class="s-foot">
        ${confirming === s.id
          ? `<span class="q">Einheit wirklich löschen?</span>
             <button class="btn-plain" data-act="cancel">Abbrechen</button>
             <button class="btn-danger" data-act="del-session">Löschen</button>`
          : `<button class="btn-delete" data-act="ask-del">Einheit löschen</button>`}
      </div>
    </details>`;
  }).join("");
}

const sessionOf = el => sessions.find(s => s.id === el.closest("[data-s]").dataset.s);

list.addEventListener("input", e => {
  const t = e.target;
  if (!t.dataset.k) return;
  const s = sessionOf(t);
  s.exercises[t.dataset.e].sets[t.dataset.j][t.dataset.k] = t.value.replace(",", ".").trim();
  save();
  const [a, b] = counts(s);
  const c = t.closest("details").querySelector(".s-count");
  c.textContent = `${a} / ${b} Sätze ausgefüllt`;
  c.classList.toggle("full", a === b && b > 0);
});

list.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const s = sessionOf(b);
  const act = b.dataset.act;
  if (act === "add-set") s.exercises[b.dataset.e].sets.push({ w: "", r: "" });
  if (act === "del-set") s.exercises[b.dataset.e].sets.splice(b.dataset.j, 1);
  if (act === "del-ex") s.exercises.splice(b.dataset.e, 1);
  if (act === "ask-del") confirming = s.id;
  if (act === "cancel") confirming = null;
  if (act === "del-session") { sessions = sessions.filter(x => x !== s); confirming = null; }
  save();
  render();
  if (act === "add-set") {
    const sets = list.querySelector(`[data-s="${s.id}"] .ex:nth-child(${+b.dataset.e + 1}) .sets`);
    sets.lastElementChild?.querySelector("input")?.focus();
  }
});

list.addEventListener("toggle", e => { openState[e.target.dataset.s] = e.target.open; }, true);

document.querySelectorAll("[data-add]").forEach(btn => btn.addEventListener("click", () => {
  const key = btn.dataset.add;
  const s = { id: uid(), date: today(), plan: key, exercises: plans[key].map(({ n, en, t, c }) => ({ n, en, t, sets: Array.from({ length: +c || 1 }, () => ({ w: "", r: "" })) })) };
  sessions.push(s);
  save();
  render();
  list.querySelector(`[data-s="${s.id}"] input`)?.focus();
}));

const plansEl = document.getElementById("plans");
const planOpen = {};
function renderPlan() {
  plansEl.innerHTML = Object.entries(plans).map(([key, plan]) => `
  <details class="session plan" data-p="${key}" ${planOpen[key] ? "open" : ""}>
    <summary>Plan ${PLAN_NAMES[key]} bearbeiten</summary>
    <div class="plan-body">
    <p class="plan-hint">Änderungen gelten für neue Einheiten. Bestehende Einheiten bleiben, wie sie sind.</p>` +
    plan.map((x, i) => `
    <div class="p-row" data-i="${i}">
      <input class="p-name" id="pn-${key}-${i}" data-k="n" value="${esc(x.n)}" placeholder="Name" aria-label="Übung ${i + 1} Name">
      <input id="pe-${key}-${i}" data-k="en" value="${esc(x.en)}" placeholder="Englischer Name" aria-label="Übung ${i + 1} englischer Name">
      <input id="pt-${key}-${i}" data-k="t" value="${esc(x.t)}" placeholder="Ziel, z. B. 3 × 8–10" aria-label="Übung ${i + 1} Ziel">
      <div class="p-tools">
        <label>Sätze <input id="pc-${key}-${i}" data-k="c" type="number" min="1" max="10" inputmode="numeric" value="${esc(x.c)}"></label>
        <button class="btn-x" data-act="up" aria-label="Übung ${i + 1} nach oben" ${i ? "" : "disabled"}>↑</button>
        <button class="btn-x" data-act="down" aria-label="Übung ${i + 1} nach unten" ${i < plan.length - 1 ? "" : "disabled"}>↓</button>
        <button class="btn-x" data-act="rm" aria-label="Übung ${i + 1} entfernen">✕</button>
      </div>
    </div>`).join("") +
    `<div><button class="btn-ghost" data-act="add">+ Übung</button></div></div></details>`).join("");
}
plansEl.addEventListener("toggle", e => { planOpen[e.target.dataset.p] = e.target.open; }, true);
const planOf = el => plans[el.closest("[data-p]").dataset.p];
plansEl.addEventListener("input", e => {
  const t = e.target;
  planOf(t)[t.closest("[data-i]").dataset.i][t.dataset.k] = t.value;
  savePlan();
});
plansEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const plan = planOf(b);
  const i = +b.closest("[data-i]")?.dataset.i;
  const act = b.dataset.act;
  if (act === "add") plan.push({ n: "", en: "", t: "", c: 3 });
  if (act === "rm") plan.splice(i, 1);
  if (act === "up" || act === "down") {
    const j = act === "up" ? i - 1 : i + 1;
    [plan[i], plan[j]] = [plan[j], plan[i]];
  }
  savePlan();
  renderPlan();
  if (act === "add") [...plansEl.querySelectorAll(`[data-p="${b.closest("[data-p]").dataset.p}"] .p-name`)].pop()?.focus();
});

renderPlan();
render();
</script>
</body>
</html>
